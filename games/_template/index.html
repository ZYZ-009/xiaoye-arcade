<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游戏模板</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;text-align:center;padding:24px;background:#1B1030;color:#fff;
       font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
  h1{font-size:28px;margin:0 0 10px}
  p{color:rgba(255,255,255,.65);margin:0 0 26px;line-height:1.8;font-size:15px}
  button{font:900 17px/1 inherit;color:#fff;background:#58CC02;border:0;border-radius:16px;
         height:56px;padding:0 28px;cursor:pointer;box-shadow:0 4px 0 #46A302}
  button:active{transform:translateY(4px);box-shadow:0 0 0 #46A302}
  code{background:rgba(255,255,255,.12);padding:3px 8px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
  <div>
    <h1>🌵 这里是你的游戏</h1>
    <p>
      把 <code>games/_template/index.html</code> 换成你自己的东西。<br>
      入口文件名必须叫 <code>index.html</code>。
    </p>
    <button onclick="document.body.style.background='#58CC02'">点我试试</button>
  </div>
</body>
</html>
